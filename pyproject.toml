[build-system]
requires = ["setuptools>=80.9"]
build-backend = "setuptools.build_meta"

[project]
name = "aiq-magnet-evals"
version = "0.1.0"
description = "Backend-agnostic evaluation runtime and artifact interface for AIQ"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kitware" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
# kwconf (CLIs) is pure Python with no dependencies of its own; workers import
# it from the caller, like magnet_evals itself.
dependencies = ["kwconf>=0.12.0"]

[project.optional-dependencies]
harbor = [
  "harbor==0.23.0; python_version >= '3.12'",
]
inspect = [
  "inspect-ai==0.3.272",
]
tests = [
  "pytest>=8.1.1",
  "pytest-cov>=5",
  "xdoctest>=1.1.5",
]
dev = [
  "aiq-magnet-evals[tests]",
  "ruff>=0.9",
]

[project.scripts]
aiq-magnet-evals = "magnet_evals.cli:main"
# Original command name, kept as an alias.
aiq-evals = "magnet_evals.cli:main"

[project.urls]
Repository = "https://github.com/Erotemic/aiq-magnet-evals"

[tool.setuptools.packages.find]
include = ["magnet_evals*"]

[tool.setuptools.package-data]
magnet_evals = ["py.typed", "benchmarks/data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "native: needs a real engine environment (tests/native, auto-applied)",
  "release_gate: required for release; can never be quarantined",
  "external: depends on a network service outside this repository",
  "paid: consumes a paid API",
  "gpu: needs a GPU",
  "docker_sandbox: needs a Docker daemon for engine sandboxes",
]

[tool.ruff]
target-version = "py311"
line-length = 88
lint.select = ["E", "F", "I"]
lint.ignore = ["E501"]
# Captured native sources are immutable evidence, and task repositories are
# sandbox inputs. Neither is a host-side implementation lint target.
extend-exclude = ["tests/fixtures/harbor-native", "tests/fixtures/harbor-hardkill-native", "tests/fixtures/swebench-pro-native", "tests/fixtures/swebench-pro-agent-native", "tests/fixtures/swebench-verified-native", "tests/native/harbor_tasks"]

# Example task modules import their engine at module level (Inspect's @task and
# OLMo's @register need it); they only ever load inside that engine's worker.
[[tool.ty.overrides]]
include = ["magnet_evals/examples/inspect_tasks.py", "magnet_evals/examples/olmo_tasks.py"]
rules = { unresolved-import = "ignore" }

[tool.coverage.run]
branch = true
source = ["magnet_evals"]

[tool.coverage.report]
show_missing = true

[tool.xcookie]
tags = ["github", "purepy"]
mod_name = "magnet_evals"
repo_name = "aiq-magnet-evals"
url = "https://github.com/Erotemic/aiq-magnet-evals"
pkg_name = "aiq-magnet-evals"
typed = true
os = ["linux"]
min_python = "3.11"
max_python = "3.14"
main_python = "3.13"
ci_cpython_versions = ["3.11", "3.13"]
ci_pypy_versions = []
use_setup_py = false
use_pyproject_requirements = true
linter = true

# Engine-native acceptance + conformance jobs (plan phase 8). Each runs a
# dev/ci script so local runs match CI; see docs/release-gate.md.
[tool.xcookie.ci_source_checks.native-inspect]
name = "Native Inspect (inspect-ai 0.3.272)"
python_version = "3.11"
setup_commands = ["python -m pip install uv"]
commands = ["dev/ci/native_inspect.sh"]

[tool.xcookie.ci_source_checks.native-olmo]
name = "Native OLMo Eval (73ade80, locked worker)"
python_version = "3.12"
setup_commands = ["python -m pip install uv"]
commands = ["dev/ci/native_olmo.sh"]

[tool.xcookie.ci_source_checks.native-helm]
name = "Native HELM (crfm-helm 0.5.14)"
python_version = "3.12"
setup_commands = ["python -m pip install uv"]
commands = ["dev/ci/native_helm.sh"]

[tool.xcookie.ci_source_checks.native-helm.env]
MAGNET_REPO = "https://github.com/AIQ-Kitware/aiq-magnet.git"
MAGNET_REV = "7bb105ab1c85bfaa01bf68c97ff7523332479ee4"
